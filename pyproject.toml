[project]
name = "robin"
version = "0.1.0"
description = "ROBIN: asistente virtual de escritorio para Windows"
readme = "docs/README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6-essentials>=6.12",
    "openai-codex>=0.171",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.6",
    "numpy>=2.5.5",
    "sherpa-onnx>=2.0.2",
]

[project.scripts]
robin = "robin.__main__:main"

[project.gui-scripts]
robin-gui = "robin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robin"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
